<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>랜덤 쿠폰 뽑기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
  /* 영문·숫자는 지마켓 산스, 한글은 Noto Sans KR */
  @font-face {
    font-family: "Gmarket Sans Latin";
    src: url("fonts/GmarketSansMedium-latin.woff2") format("woff2");
    font-weight: 100 900;
    font-display: swap;
    unicode-range: U+0020-007E, U+00B7, U+2014, U+2026;
  }
  :root {
    color-scheme: dark;
    --bg: #08090c;
    --panel: #12151b;
    --line: #232a35;
    --ink: #f3f5f8;
    --muted: #929aa8;
    --accent: #1a86f2;
    --accent-hot: #45a3ff;
    --accent-deep: #0b5bc7;
    --silver: #cfcdd2;
    --sans: "Gmarket Sans Latin", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    --latin: "Gmarket Sans Latin", "Noto Sans KR", system-ui, sans-serif;
  }
  [hidden] { display: none !important; }
  html, body { background: var(--bg); color: var(--ink); }
  body { font-family: var(--sans); padding-inline: 16px; letter-spacing: -0.01em; word-break: keep-all; }
  .wrap { max-width: 440px; margin: 0 auto; padding-block: 48px 64px; display: flex; flex-direction: column; align-items: center; text-align: center; }

  .eyebrow { font-family: var(--latin); font-weight: 800; font-size: 14px; letter-spacing: .04em; color: var(--accent); padding-bottom: 4px; border-bottom: 2px solid var(--accent); }
  h1 { margin: 14px 0 0; font-size: clamp(32px, 9vw, 42px); font-weight: 900; letter-spacing: -0.04em; line-height: 1.2; text-wrap: balance; }
  .lede { margin: 12px 0 0; color: var(--muted); font-size: 14px; line-height: 1.65; letter-spacing: -0.01em; }

  /* machine */
  .stage { position: relative; width: min(300px, 78vw); margin-top: 28px; padding-bottom: 40px; }
  .machine { position: relative; width: 100%; aspect-ratio: 300 / 440; max-width: 100%; }
  .machine > .layer, .machine > canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .machine img { pointer-events: none; user-select: none; }
  .knob { position: absolute; left: calc(320 / 900 * 100%); top: calc(875 / 1320 * 100%); width: calc(220 / 900 * 100%); }
  #knob { transform-origin: 50% 50%; transition: transform 1.1s cubic-bezier(.5,0,.2,1); }
  .machine.shake { animation: shake .5s ease-in-out 2; }
  @keyframes shake {
    0%,100% { transform: translateX(0) rotate(0); }
    25% { transform: translateX(-3px) rotate(-1deg); }
    75% { transform: translateX(3px) rotate(1deg); }
  }

  .capsule { position: absolute; left: calc(432 / 900 * 100%); top: calc(1165 / 1320 * 100%); width: 19.3%; aspect-ratio: 1; margin: -9.65% 0 0 -9.65%; opacity: 0; pointer-events: none; z-index: 3; }
  .capsule .half { position: absolute; left: 0; width: 100%; height: 50%; transition: transform .45s cubic-bezier(.2,.8,.2,1), opacity .45s; }
  .capsule .top { top: 0; background: var(--ball) center top / 100% 200% no-repeat; }
  .capsule .bot { bottom: 0; background: var(--ball) center bottom / 100% 200% no-repeat; }
  .capsule.open .top { transform: translateY(-70%) rotate(-28deg); opacity: 0; }
  .capsule.open .bot { transform: translateY(70%) rotate(18deg); opacity: 0; }
  .burst { position: absolute; left: 50%; top: 50%; width: 10px; height: 10px; margin: -5px; border-radius: 50%; background: radial-gradient(circle, #fff 0%, var(--accent-hot) 40%, transparent 70%); opacity: 0; }
  .capsule.open .burst { animation: burst .6s ease-out forwards; }
  @keyframes burst { 0% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(14); } }

  .draw { margin-top: 8px; width: min(280px, 100%); height: 60px; border: 0; background: var(--accent); color: #fff; font: 700 17px/1 var(--sans); letter-spacing: -0.02em; cursor: pointer; transition: background .2s, transform .1s; }
  .draw:hover { background: var(--accent-hot); }
  .draw:active { transform: translateY(1px); }
  .draw:disabled { background: #1c3558; color: #9fbde6; cursor: default; }
  .draw:focus-visible, .btn:focus-visible, summary:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }

  details { margin-top: 18px; width: 100%; color: var(--muted); font-size: 14px; }
  summary { list-style: none; cursor: pointer; display: inline-block; padding: 4px 8px; }
  summary::-webkit-details-marker { display: none; }
  summary::before { content: "+ "; }
  details[open] summary::before { content: "− "; }
  .notice { margin-top: 12px; padding: 18px 20px; background: var(--panel); border: 1px solid var(--line); text-align: left; display: flex; flex-direction: column; gap: 14px; }
  .notice ul { margin: 0; padding-left: 18px; line-height: 1.7; font-size: 13px; }
  .odds { width: 100%; border-collapse: collapse; font-size: 13px; }
  .odds th, .odds td { padding: 7px 0; border-bottom: 1px solid var(--line); text-align: left; font-weight: 400; }
  .odds th { color: var(--muted); font-size: 12px; }
  .odds td:last-child, .odds th:last-child { text-align: right; font-family: var(--latin); font-variant-numeric: tabular-nums; color: var(--ink); }
  .notice .ex { font-size: 12px; color: #6d7482; }

  /* result modal */
  .overlay { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 24px 16px; background: rgba(3,5,9,.78); backdrop-filter: blur(6px); }
  .overlay:not([hidden]) { animation: fade .25s ease-out; }
  @keyframes fade { from { opacity: 0; } }
  .result { width: min(360px, 100%); background: var(--panel); border: 1px solid var(--line); padding: 28px 22px 22px; text-align: center; animation: pop .45s cubic-bezier(.2,1.4,.4,1); }
  @keyframes pop { from { transform: scale(.85) translateY(20px); opacity: 0; } }
  .result .eyebrow { display: inline-block; }
  .result h2 { margin: 12px 0 18px; font-size: 22px; font-weight: 900; letter-spacing: -0.03em; }

  .ticket { position: relative; display: grid; grid-template-columns: 1fr auto; align-items: stretch; background: linear-gradient(135deg, var(--accent-hot), var(--accent) 50%, var(--accent-deep)); color: #fff; text-align: left; }
  .ticket::before, .ticket::after { content: ""; position: absolute; right: 88px; width: 18px; height: 18px; margin-right: -9px; border-radius: 50%; background: var(--panel); }
  .ticket::before { top: -9px; } .ticket::after { bottom: -9px; }
  .ticket .main { padding: 18px 16px 16px 18px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .ticket .amount { font-family: var(--latin); font-weight: 900; font-size: 50px; line-height: 1; letter-spacing: -0.02em; }
  .ticket .amount small { font-size: 26px; margin-left: 2px; }
  .ticket .name { font-weight: 700; font-size: 15px; }
  .ticket .cond { font-size: 12px; opacity: .85; }
  .ticket .stub { width: 88px; border-left: 2px dashed rgba(255,255,255,.55); display: grid; place-items: center; padding: 10px 6px; }
  .ticket .stub span { writing-mode: vertical-rl; font-family: var(--latin); font-weight: 800; font-size: 12px; letter-spacing: .14em; }
  .ticket.jackpot { background: linear-gradient(135deg, #fff1a8, #ffc93c 40%, #1a86f2); color: #0a1a33; }
  .ticket.lose { background: #262c38; color: var(--ink); }
  .ticket.lose .amount { font-family: var(--sans); font-size: 44px; }
  .ticket.lose .stub { border-left-color: rgba(255,255,255,.2); }
  .ticket.jackpot .stub { border-left-color: rgba(10,26,51,.4); }

  .code { margin-top: 16px; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 12px; background: #0b0d12; border: 1px dashed #34405a; }
  .code span { font-family: var(--latin); font-weight: 600; font-size: 15px; letter-spacing: .04em; user-select: all; overflow-wrap: anywhere; text-align: left; }
  .code .copy { flex: none; background: transparent; border: 1px solid #3e4a60; color: var(--ink); font: 500 12px/1 var(--sans); padding: 8px 10px; cursor: pointer; }
  .meta { margin: 10px 0 0; color: var(--muted); font-size: 12px; }
  .actions { margin-top: 18px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .btn { height: 48px; border: 0; font: 700 15px/1 var(--sans); cursor: pointer; }
  .btn.ghost { background: #1d222c; color: var(--ink); }
  .btn.solid { background: var(--accent); color: #fff; }

  @media (prefers-reduced-motion: reduce) {
    .machine.shake, .result, .overlay:not([hidden]) { animation: none; }
    #knob { transition-duration: .01s; }
  }
</style>
</head>
<body style="margin:0">

<main class="wrap">
  <span class="eyebrow">RANDOM COUPON</span>
  <h1>랜덤 쿠폰 뽑기</h1>
  <p class="lede">레버를 돌리면 캡슐이 하나 나와요.<br>어떤 쿠폰이 들어 있을까요?</p>

  <div class="stage">
    <div class="machine" id="machine">
      <canvas id="balls" aria-hidden="true"></canvas>
      <img class="layer" src="assets/machine.png" alt="" draggable="false">
      <img class="knob" id="knob" src="assets/knob.png" alt="" draggable="false">

      <div class="capsule" id="capsule" aria-hidden="true">
        <div class="burst"></div>
        <div class="half top"></div>
        <div class="half bot"></div>
      </div>
    </div>
  </div>

  <button class="draw" id="draw" type="button">랜덤 쿠폰 뽑기</button>

  <details>
    <summary>유의사항</summary>
    <div class="notice">
      <table class="odds">
        <thead><tr><th>쿠폰</th><th>당첨 확률</th></tr></thead>
        <tbody id="odds"></tbody>
      </table>
      <ul>
        <li>쿠폰은 발급일로부터 7일간 사용할 수 있어요.</li>
        <li>쿠폰은 한 주문에 1장만 적용돼요.</li>
        <li>일부 브랜드와 상품은 쿠폰 적용에서 제외될 수 있어요.</li>
      </ul>
    </div>
  </details>
</main>

<div class="overlay" id="overlay" hidden>
  <div class="result" role="dialog" aria-modal="true" aria-labelledby="resultTitle">
    <span class="eyebrow" id="resultEyebrow">CONGRATULATIONS</span>
    <h2 id="resultTitle">쿠폰이 나왔어요!</h2>
    <div class="ticket" id="ticket">
      <div class="main">
        <div class="amount" id="amount"></div>
        <div class="name" id="cname"></div>
        <div class="cond" id="cond"></div>
      </div>
      <div class="stub"><span id="stub">COUPON</span></div>
    </div>
    <div class="code" id="codeBox"><span id="code"></span><button class="copy" id="copy" type="button">코드 복사</button></div>
    <p class="meta" id="expire"></p>
    <div class="actions">
      <button class="btn ghost" id="again" type="button">한 번 더 뽑기</button>
      <button class="btn solid" id="close" type="button">확인</button>
    </div>
  </div>
</div>

<script>
/* ===== 쿠폰 설정: 이름, 조건, 가중치(weight)만 바꾸면 돼요 ===== */
const COUPONS = [
  { amount: "꽝",   unit: "",  name: "꽝",             cond: "다음 기회에 다시 도전해 주세요",       weight: 40, lose: true },
  { amount: "5",    unit: "%", name: "5% 할인 쿠폰",   cond: "전 상품 · 최대 5,000원 할인",          weight: 25 },
  { amount: "10",   unit: "%", name: "10% 할인 쿠폰",  cond: "3만원 이상 구매 시 · 최대 1만원 할인",  weight: 18 },
  { amount: "FREE", unit: "",  name: "무료배송 쿠폰",  cond: "금액 조건 없이 배송비 무료",           weight: 12 },
  { amount: "20",   unit: "%", name: "20% 할인 쿠폰",  cond: "5만원 이상 구매 시 · 최대 3만원 할인",  weight: 4 },
  { amount: "30",   unit: "%", name: "30% 할인 쿠폰",  cond: "7만원 이상 구매 시 · 최대 5만원 할인",  weight: 1, jackpot: true },
];

const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
const $ = (id) => document.getElementById(id);

// odds table
const totalW = COUPONS.reduce((s, c) => s + c.weight, 0);
$("odds").innerHTML = COUPONS.map(c =>
  `<tr><td>${c.name}</td><td>${(c.weight / totalW * 100).toFixed(1)}%</td></tr>`).join("");

function pickCoupon() {
  let r = Math.random() * totalW;
  for (const c of COUPONS) { if ((r -= c.weight) < 0) return c; }
  return COUPONS[0];
}

/* ===== 공 물리 ===== */
const machine = $("machine");
const canvas = $("balls");
const ctx = canvas.getContext("2d");
// 기계 이미지(900×1320)를 3으로 나눈 좌표계
const DOME = { x: 149, y: 165.3, R: 110 };
const FLOOR = 262;       // 받침 윗면 조금 아래: 공 아랫부분이 받침에 살짝 가려져요
const BR = 29;
const WHITE = [255, 255, 255];
const BALL_TYPES = [
  { a: [255, 86, 88] },                      // 빨강
  { a: [22, 150, 255] },                     // 파랑
  { a: [24, 212, 100] },                     // 초록
  { a: [214, 250, 230] },                    // 민트
  { a: [22, 150, 255], b: WHITE, split: .1 },  // 파랑/흰색
  { a: [255, 222, 32], b: WHITE, split: -.05 }, // 노랑/흰색
  { a: [24, 212, 100], b: WHITE, split: .15 },  // 초록/흰색
  { a: [255, 86, 88], b: WHITE, split: 0 },     // 빨강/흰색
];
const shadeImg = new Image(); shadeImg.src = "assets/ball-shade.png";
const glossImg = new Image(); glossImg.src = "assets/ball-gloss.png";
const sprite = document.createElement("canvas");
const sctx = sprite.getContext("2d");
const rgb = (c) => `rgb(${c[0]},${c[1]},${c[2]})`;

let balls = [];
let typeCursor = Math.floor(Math.random() * BALL_TYPES.length);
function makeBall(x, y) {
  const type = BALL_TYPES[typeCursor++ % BALL_TYPES.length];
  return { x, y, vx: (Math.random() - .5) * 2, vy: 0, a: Math.random() * 6.28, type, alpha: 1 };
}
for (let i = 0; i < 9; i++) {
  balls.push(makeBall(DOME.x - 60 + (i % 4) * 40, 150 + Math.floor(i / 4) * 30));
}

let agitate = 0;         // 0 = idle, >0 frames of strong mixing
let scale = 1;
function resize() {
  const w = machine.clientWidth, h = machine.clientHeight;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
  scale = (w / 300) * dpr;
}
new ResizeObserver(resize).observe(machine);
resize();

function step() {
  const G = 0.28, lim = DOME.R - BR;
  for (const b of balls) {
    b.vy += G;
    const below = b.y - DOME.y;
    if (agitate > 0) {
      // blower from below + swirl
      if (below > 10 && Math.random() < 0.35) { b.vy -= 2.2 + Math.random() * 3.2; b.vx += (Math.random() - .5) * 3.5; }
      b.vx += -(b.y - DOME.y) * 0.004;
      b.vy += (b.x - DOME.x) * 0.004;
    } else if (!reduceMotion && below > 40 && Math.random() < 0.012) {
      // gentle idle puffs so balls keep rolling
      b.vy -= 2.5 + Math.random() * 2.5; b.vx += (Math.random() - .5) * 2.4;
    }
    b.vx *= 0.994; b.vy *= 0.994;
    b.x += b.vx; b.y += b.vy;
    b.a += b.vx / BR;
  }
  for (let it = 0; it < 3; it++) {
    for (let i = 0; i < balls.length; i++) {
      const p = balls[i];
      for (let j = i + 1; j < balls.length; j++) {
        const q = balls[j];
        const dx = q.x - p.x, dy = q.y - p.y, d2 = dx * dx + dy * dy, min = BR * 2;
        if (d2 < min * min && d2 > 0.0001) {
          const d = Math.sqrt(d2), nx = dx / d, ny = dy / d, o = (min - d) / 2;
          p.x -= nx * o; p.y -= ny * o; q.x += nx * o; q.y += ny * o;
          const rv = (q.vx - p.vx) * nx + (q.vy - p.vy) * ny;
          if (rv < 0) { const k = -(1 + 0.55) * rv / 2; p.vx -= k * nx; p.vy -= k * ny; q.vx += k * nx; q.vy += k * ny; }
        }
      }
    }
    for (const b of balls) {
      const dx = b.x - DOME.x, dy = b.y - DOME.y, d = Math.hypot(dx, dy);
      if (d > lim) {
        const nx = dx / d, ny = dy / d;
        b.x = DOME.x + nx * lim; b.y = DOME.y + ny * lim;
        const vn = b.vx * nx + b.vy * ny;
        if (vn > 0) { b.vx -= 1.5 * vn * nx; b.vy -= 1.5 * vn * ny; }
        b.vx *= 0.99;
      }
      if (b.y > FLOOR - BR) { b.y = FLOOR - BR; if (b.vy > 0) b.vy *= -0.5; b.vx *= 0.98; }
    }
  }
  if (agitate > 0) agitate--;
}

// 공 한 개를 px 크기로 그린 캔버스: 무늬는 굴러가며 회전하고, 음영은 고정
function renderBall(b, px) {
  sprite.width = sprite.height = px;
  const t = b.type;
  sctx.save();
  sctx.translate(px / 2, px / 2); sctx.rotate(b.a);
  sctx.fillStyle = rgb(t.a); sctx.fillRect(-px, -px, px * 2, px * 2);
  if (t.b) { sctx.fillStyle = rgb(t.b); sctx.fillRect(-px, t.split * px / 2, px * 2, px * 2); }
  sctx.restore();
  if (shadeImg.complete && shadeImg.naturalWidth) {
    sctx.globalCompositeOperation = "multiply";
    sctx.drawImage(shadeImg, 0, 0, px, px);
    if (glossImg.complete && glossImg.naturalWidth) {
      sctx.globalCompositeOperation = "screen";
      sctx.drawImage(glossImg, 0, 0, px, px);
    }
    sctx.globalCompositeOperation = "destination-in";
    sctx.drawImage(shadeImg, 0, 0, px, px);
  } else {
    sctx.globalCompositeOperation = "destination-in";
    sctx.beginPath(); sctx.arc(px / 2, px / 2, px / 2, 0, Math.PI * 2); sctx.fill();
  }
  sctx.globalCompositeOperation = "source-over";
  return sprite;
}

function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  ctx.save();
  ctx.beginPath(); ctx.arc(DOME.x, DOME.y, DOME.R + 2, 0, Math.PI * 2); ctx.clip();
  // 빈 유리 안쪽
  const g = ctx.createRadialGradient(DOME.x - 20, DOME.y - 25, 10, DOME.x, DOME.y, DOME.R + 2);
  g.addColorStop(0, "rgba(225,230,248,.10)"); g.addColorStop(.7, "rgba(215,222,245,.18)"); g.addColorStop(1, "rgba(205,214,242,.42)");
  ctx.fillStyle = g; ctx.fillRect(0, 0, 300, 300);
  const px = Math.ceil(BR * 2 * scale);
  const sorted = balls.slice().sort((a, b) => a.y - b.y);
  for (const b of sorted) {
    ctx.globalAlpha = b.alpha;
    ctx.drawImage(renderBall(b, px), b.x - BR, b.y - BR, BR * 2, BR * 2);
  }
  ctx.globalAlpha = 1;
  // 공 위에 얇게 덮이는 유리
  ctx.fillStyle = "rgba(225,232,255,.10)"; ctx.fillRect(0, 0, 300, 300);
  ctx.restore();
}

let last = performance.now(), acc = 0;
function loop(t) {
  acc += Math.min(t - last, 100); last = t;
  while (acc >= 16.67) { step(); acc -= 16.67; }
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* ===== 뽑기 ===== */
const drawBtn = $("draw"), knob = $("knob"), capsule = $("capsule"), overlay = $("overlay");
let knobTurns = 0, busy = false, current = null;
const wait = (ms) => new Promise(r => setTimeout(r, reduceMotion ? Math.min(ms, 120) : ms));

function randomCode() {
  const A = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let s = "";
  for (let i = 0; i < 8; i++) s += A[Math.floor(Math.random() * A.length)];
  return "GACHA-" + s.slice(0, 4) + "-" + s.slice(4);
}

async function draw() {
  if (busy) return;
  busy = true; drawBtn.disabled = true; drawBtn.textContent = "뽑는 중…";
  const prize = pickCoupon();

  knobTurns++;
  knob.style.transform = `rotate(${knobTurns * 360}deg)`;
  if (!reduceMotion) machine.classList.add("shake");
  agitate = 90;
  await wait(1500);
  machine.classList.remove("shake");

  // the lowest ball leaves the dome
  const out = balls.reduce((m, b) => (b.y > m.y ? b : m), balls[0]);
  const fadeStart = performance.now();
  await new Promise(res => {
    (function fade() {
      const k = Math.min((performance.now() - fadeStart) / 300, 1);
      out.alpha = 1 - k; out.vy += 1.5;
      k < 1 ? requestAnimationFrame(fade) : res();
    })();
  });
  balls = balls.filter(b => b !== out);

  // capsule drops out of the chute
  out.a = 0;
  capsule.style.setProperty("--ball", `url(${renderBall(out, 240).toDataURL()})`);
  capsule.classList.remove("open");
  const u = machine.clientWidth / 300;
  const anim = capsule.animate([
    { opacity: 0, transform: `translate(0, ${-6 * u}px) scale(.55)` },
    { opacity: 1, transform: `translate(0, 0) scale(.7)`, offset: .15 },
    { opacity: 1, transform: `translate(0, ${34 * u}px) scale(1.05)`, offset: .45, easing: "ease-out" },
    { opacity: 1, transform: `translate(0, ${20 * u}px) scale(1.12)`, offset: .62, easing: "ease-in" },
    { opacity: 1, transform: `translate(0, ${34 * u}px) scale(1.18)`, offset: .78, easing: "ease-out" },
    { opacity: 1, transform: `translate(0, ${28 * u}px) scale(1.22)`, offset: .88, easing: "ease-in" },
    { opacity: 1, transform: `translate(0, ${34 * u}px) scale(1.25)` },
  ], { duration: reduceMotion ? 1 : 1100, fill: "forwards" });
  await anim.finished;
  if (!reduceMotion) {
    await capsule.animate([
      { transform: `translate(0, ${34 * u}px) scale(1.25) rotate(0)` },
      { transform: `translate(0, ${34 * u}px) scale(1.25) rotate(-14deg)` },
      { transform: `translate(0, ${34 * u}px) scale(1.25) rotate(12deg)` },
      { transform: `translate(0, ${34 * u}px) scale(1.25) rotate(0)` },
    ], { duration: 420, fill: "forwards" }).finished;
  }
  capsule.classList.add("open");
  await wait(380);

  showResult(prize);
}

function showResult(c) {
  current = c;
  $("amount").innerHTML = c.unit ? `${c.amount}<small>${c.unit}</small>` : c.amount;
  $("cname").textContent = c.name;
  $("cond").textContent = c.cond;
  $("cname").textContent = c.lose ? "아쉽지만 이번엔 쿠폰이 없어요" : c.name;
  $("ticket").classList.toggle("jackpot", !!c.jackpot);
  $("ticket").classList.toggle("lose", !!c.lose);
  $("stub").textContent = c.lose ? "NEXT TIME" : "COUPON";
  $("codeBox").hidden = !!c.lose;
  $("expire").hidden = !!c.lose;
  $("resultEyebrow").textContent = c.lose ? "TRY AGAIN" : c.jackpot ? "JACKPOT" : "CONGRATULATIONS";
  $("resultTitle").textContent = c.lose ? "아쉽게도 꽝이에요" : c.jackpot ? "최고 등급 쿠폰이 나왔어요!" : "쿠폰이 나왔어요!";
  $("code").textContent = randomCode();
  const exp = new Date(Date.now() + 7 * 864e5);
  $("expire").textContent = `${exp.getFullYear()}.${String(exp.getMonth() + 1).padStart(2, "0")}.${String(exp.getDate()).padStart(2, "0")}까지 사용 가능`;
  $("copy").textContent = "코드 복사";
  overlay.hidden = false;
  $("close").focus();
}

function reset() {
  overlay.hidden = true;
  capsule.getAnimations().forEach(a => a.cancel());
  capsule.classList.remove("open");
  // refill the dome from the top
  const nb = makeBall(DOME.x + (Math.random() - .5) * 30, DOME.y - DOME.R + BR + 6);
  balls.push(nb);
  busy = false; drawBtn.disabled = false; drawBtn.textContent = "랜덤 쿠폰 뽑기";
}

drawBtn.addEventListener("click", draw);
$("close").addEventListener("click", () => { reset(); drawBtn.focus(); });
$("again").addEventListener("click", () => { reset(); draw(); });
overlay.addEventListener("click", (e) => { if (e.target === overlay) reset(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !overlay.hidden) reset(); });
$("copy").addEventListener("click", () => {
  const text = $("code").textContent, btn = $("copy");
  const done = () => { btn.textContent = "복사됨"; };
  const fallback = () => {
    const r = document.createRange(); r.selectNodeContents($("code"));
    const s = getSelection(); s.removeAllRanges(); s.addRange(r);
    btn.textContent = "선택됨";
  };
  try { navigator.clipboard.writeText(text).then(done, fallback); } catch { fallback(); }
});
</script>
</body>
